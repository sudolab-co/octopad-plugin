interface:
  display_name: "Octoplan for Codex"
  short_description: "Brief, plan and deliver work through agents"
  default_prompt: "Use $octoplan to confirm my brief, review the plan, and deliver it through agents once I agree."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "octopad"
      description: "Read Octopad sources and update work streams and tasks; tasks hold the plan"
      transport: "streamable_http"
      url: "https://mcp.octopad.app/mcp"
